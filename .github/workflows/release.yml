name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed only to push the formula to Solo-it/homebrew-tap — a
          # fine-grained PAT with contents:write on that one repo. Without
          # this secret goreleaser just skips the brews section.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  apt-repo:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg-dev, apt-utils and gpg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg

      - name: Import the signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "default-key $(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')" >> ~/.gnupg/gpg.conf

      - name: Download .deb packages from this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apt-repo/pool/main
          gh release download "${{ github.ref_name }}" --pattern '*.deb' --dir apt-repo/pool/main --repo "${{ github.repository }}"

      - name: Build the flat apt repository index
        run: |
          cd apt-repo
          mkdir -p dists/stable/main/binary-amd64 dists/stable/main/binary-arm64
          dpkg-scanpackages --arch amd64 pool /dev/null > dists/stable/main/binary-amd64/Packages
          dpkg-scanpackages --arch arm64 pool /dev/null > dists/stable/main/binary-arm64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
          gzip -9c dists/stable/main/binary-arm64/Packages > dists/stable/main/binary-arm64/Packages.gz

      - name: Generate and sign the Release file
        run: |
          cd apt-repo
          cat > apt-ftparchive.conf <<'EOF'
          APT::FTPArchive::Release::Origin "Solo-it";
          APT::FTPArchive::Release::Label "backupctl";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "amd64 arm64";
          APT::FTPArchive::Release::Components "main";
          EOF
          apt-ftparchive -c apt-ftparchive.conf release dists/stable > dists/stable/Release
          gpg --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg -abs -o dists/stable/Release.gpg dists/stable/Release
          cp ../apt-signing-key.asc signing-key.asc

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          destination_dir: apt
          # keep_files: true — the site (index.html, demo cast) lives
          # outside apt/ on this same branch, published separately. false
          # here would wipe it on every release.
          keep_files: true
