name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed only to push the formula to Solo-it/homebrew-tap — a
          # fine-grained PAT with contents:write on that one repo. Without
          # this secret goreleaser just skips the brews section.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  apt-repo:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Download .deb packages from this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apt-repo/pool/main
          gh release download "${{ github.ref_name }}" --pattern '*.deb' --dir apt-repo/pool/main --repo "${{ github.repository }}"

      - name: Build the flat apt repository index
        run: |
          cd apt-repo
          mkdir -p dists/stable/main/binary-amd64 dists/stable/main/binary-arm64
          dpkg-scanpackages --arch amd64 pool /dev/null > dists/stable/main/binary-amd64/Packages
          dpkg-scanpackages --arch arm64 pool /dev/null > dists/stable/main/binary-arm64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
          gzip -9c dists/stable/main/binary-arm64/Packages > dists/stable/main/binary-arm64/Packages.gz

      # NOTE: this repo is unsigned (Release file has no GPG signature),
      # so the install instructions use "deb [trusted=yes] ...". Add a
      # signing step here (with a GPG_PRIVATE_KEY secret) if that's ever
      # not acceptable — apt fully supports it, this is just the smallest
      # thing that works for a single small package.
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          destination_dir: apt
          keep_files: false
